name: Build & Release FerroSTB v1.0.0 (Native Slint Suite)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc-slint

      - name: Build Unified Windows Binary (ferrostb.exe)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package FerroSTB-Windows-v1.0.0.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FerroSTB-Windows | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ferrostb.exe dist/FerroSTB-Windows/
          Compress-Archive -Path dist/FerroSTB-Windows/* -DestinationPath dist/FerroSTB-Windows-v1.0.0.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FerroSTB-Windows-v1.0.0
          path: dist/FerroSTB-Windows-v1.0.0.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Slint Linux GUI build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libfontconfig1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Fetch Official Google Android Platform-Tools (Linux ADB)
        run: |
          mkdir -p vendor
          curl -sSL https://dl.google.com/android/repository/platform-tools-latest-linux.zip -o pt.zip
          unzip -q pt.zip platform-tools/adb
          mv platform-tools/adb ./vendor/adb_linux
          chmod +x ./vendor/adb_linux
          rm -rf pt.zip platform-tools

      - name: Install Rust GNU toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-gnu-slint

      - name: Build Unified Linux Binary (ferrostb)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package FerroSTB-Linux-v1.0.0 (.zip & .tar.gz)
        run: |
          mkdir -p dist/FerroSTB-Linux
          cp target/x86_64-unknown-linux-gnu/release/ferrostb dist/FerroSTB-Linux/
          chmod +x dist/FerroSTB-Linux/ferrostb
          cd dist
          tar -czf FerroSTB-Linux-v1.0.0.tar.gz FerroSTB-Linux/
          zip -r FerroSTB-Linux-v1.0.0.zip FerroSTB-Linux/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FerroSTB-Linux-v1.0.0
          path: |
            dist/FerroSTB-Linux-v1.0.0.zip
            dist/FerroSTB-Linux-v1.0.0.tar.gz

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release_assets
        run: |
          sha256sum FerroSTB-Windows-v1.0.0.zip FerroSTB-Linux-v1.0.0.zip FerroSTB-Linux-v1.0.0.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "FerroSTB v1.0.0 — Native Slint Cosmic-Violet Suite (Provisioner + Toolbox + ADB Shell)"
          body: |
            ### FerroSTB v1.0.0 — Single Native Executable (Zero WebView2 / Zero Browser)
            * **Native Slint UI + SVG Branding:** Lightweight native Cosmic-Violet interface with prominent Connect-to-STB banner across all Toolbox tabs.
            * **VPN-Safe IPv4 Detection:** Filters out Cloudflare WARP, Tailscale, WireGuard, OpenVPN, WSL, and Hyper-V virtual interfaces automatically, with an interactive LAN adapter selector.
            * **Bundled `forged_chain.pem`:** JHSB200/JHSC200/JHSD200 and JMS support built directly into one executable.
            * **`FerroSTB-Windows-v1.0.0.zip`**: Single `ferrostb.exe` for Windows 10/11 (Run as Administrator).
            * **`FerroSTB-Linux-v1.0.0.zip` / `.tar.gz`**: Single `ferrostb` for Linux x86_64 (`sudo ./ferrostb`).
            * **`SHA256SUMS.txt`**: SHA-256 checksums for verifying all release archives before running with Administrator/sudo privileges.
          draft: false
          prerelease: false
          files: |
            release_assets/FerroSTB-Windows-v1.0.0.zip
            release_assets/FerroSTB-Linux-v1.0.0.zip
            release_assets/FerroSTB-Linux-v1.0.0.tar.gz
            release_assets/SHA256SUMS.txt
