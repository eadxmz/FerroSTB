[package]
name = "ferrostb"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "Unified single-binary native Slint Rust Suite: Jio STB TR-069 Unlocker (JHS & JMS) + Visual ADB Toolbox + Advanced Shell"

[dependencies]
slint = { version = "1.19", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-femtovg", "renderer-software"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1.40", features = ["full"] }
socket2 = "0.5"
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6"
flate2 = "1.0"
local-ip-address = "0.6"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "1.19"
winresource = "0.1"

[package.metadata.winresource]
ProductName = "FerroSTB"
FileDescription = "FerroSTB — Native Jio STB Provisioner & ADB Toolbox"
OriginalFilename = "ferrostb.exe"

[[bin]]
name = "ferrostb"
path = "src/main.rs"
