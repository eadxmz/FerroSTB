[package]
name = "ferrostb"
version = "1.0.0"
edition = "2021"
description = "Unified single-binary Rust UI Suite: Jio STB TR-069 Unlocker (JHS & JMS) + Visual ADB Toolbox + Advanced Shell"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
socket2 = "0.5"
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6"
flate2 = "1.0"
local-ip-address = "0.6"
anyhow = "1.0"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "ferrostb"
path = "src/main.rs"
